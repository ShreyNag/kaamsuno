<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaamSuno Live Report</title>
<style>
  :root {
    --bg:#f6f6f4; --card:#ffffff; --fg:#161616; --muted:#6b6b6b; --line:#e2e2de;
    --ok:#1e7a3c; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fde8e6; --warn:#9a5b00; --warn-bg:#fff1d6;
    --info-bg:#e8eef9; --info:#24408e; --flash:#fff3a8; --filled:#f1f8f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#121212; --card:#1c1c1c; --fg:#ececec; --muted:#9a9a9a; --line:#333;
      --ok:#7bd88f; --ok-bg:#163321; --bad:#ff8a80; --bad-bg:#3a1714; --warn:#ffb74d; --warn-bg:#3a2a10;
      --info-bg:#1b2540; --info:#9fb6ff; --flash:#5a5120; --filled:#18261b;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--fg);
         font:20px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:980px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:28px; margin:0; }
  .meta { color:var(--muted); font-size:15px; }
  #banner { margin:16px 0; padding:16px 20px; border-radius:12px; font-size:26px; font-weight:650;
            background:var(--info-bg); color:var(--info); }
  #banner.ok { background:var(--ok-bg); color:var(--ok); }
  #banner.bad { background:var(--bad-bg); color:var(--bad); }
  #banner.warn { background:var(--warn-bg); color:var(--warn); }
  #banner small { display:block; font-size:16px; font-weight:400; margin-top:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .card { background:var(--card); border:2px dashed var(--line); border-radius:12px; padding:12px 16px;
          min-height:92px; transition:background 1.8s ease, border-color .4s; }
  .card.filled { border-style:solid; border-color:var(--ok); background:var(--filled); }
  .card.flash { background:var(--flash); transition:none; }
  .card.wide { grid-column:1 / -1; }
  .label { font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .value { font-size:26px; font-weight:650; margin-top:4px; word-break:break-word; }
  .value.empty { color:var(--muted); font-weight:400; font-size:20px; font-style:italic; }
  .old { color:var(--muted); font-size:15px; text-decoration:line-through; }
  .pill { display:inline-block; padding:2px 14px; border-radius:999px; color:#fff; }
  .u-emergency { background:#c62828; } .u-high { background:#e65100; }
  .u-normal { background:#a07800; } .u-low { background:#2e7d32; }
  h2 { font-size:17px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:26px 0 8px; }
  #bot { background:var(--card); border-left:6px solid var(--info); border-radius:8px; padding:12px 16px; font-size:22px; }
  #captions div { padding:6px 0; border-bottom:1px solid var(--line); }
  #captions div:last-child { font-weight:600; }
  .empty-note { color:var(--muted); font-style:italic; }
  details { margin-top:28px; font-size:15px; }
  details table { border-collapse:collapse; width:100%; }
  details td, details th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
  .wrap { overflow-x:auto; }
  @media (max-width:520px) { body { font-size:18px; } .value { font-size:22px; } #banner { font-size:21px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>KaamSuno · live incident report</h1>
    <div class="meta">report <span id="rid">…</span></div>
  </header>

  <div id="banner">Connecting…</div>

  <div class="grid" id="cards"></div>

  <h2>Bot said</h2>
  <div id="bot"><span class="empty-note">nothing yet</span></div>

  <h2>Worker said</h2>
  <div id="captions"><span class="empty-note">nothing yet</span></div>

  <details>
    <summary>All fields (confidence, evidence)</summary>
    <div class="wrap"><table>
      <thead><tr><th>field</th><th>value</th><th>conf.</th><th>evidence</th></tr></thead>
      <tbody id="fields"></tbody>
    </table></div>
  </details>
</main>

<script>
const sid = location.pathname.split("/").filter(Boolean)[1];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// The cards a supervisor cares about, in reading order; quantity shows its unit
const CARDS = ["urgency", "incident_type", "location", "asset_or_equipment", "material", "quantity",
               "people_at_risk", "description"];
const OPTIONAL = new Set(["asset_or_equipment", "material", "quantity", "people_at_risk"]);  // hidden until filled
let prev = {}, prevReport = null;

function banner(s) {
  const sent = s.sent || [];
  const report = sent.filter(x => x.kind === "report").pop();
  const alert = sent.filter(x => x.kind === "emergency").pop();
  if (report && report.ok) return ["ok", "✓ Sent to supervisor", "The worker confirmed the report."];
  if (report) return ["bad", "Not sent: saved on this device", "The supervisor channel did not accept it."];
  if (alert && alert.ok) return ["bad", "🚨 Emergency alert sent to supervisor", "Collecting the remaining details…"];
  if (alert) return ["bad", "🚨 Emergency: alert NOT sent", "The worker was told to call the supervisor."];
  return {
    collecting: ["", "Collecting details…", ""],
    readback: ["warn", "Reading back: waiting for the worker's OK", ""],
    confirmed: ["warn", "Confirmed by the worker", "Asked “anything else?” before sending."],
    submitted: ["", "Sending…", ""],
  }[s.phase] || ["", s.status || "", ""];
}

function render(s) {
  if (prevReport !== s.incident_id) { prev = {}; prevReport = s.incident_id; }
  document.getElementById("rid").textContent = s.incident_id || sid;
  const [cls, text, sub] = banner(s);
  const b = document.getElementById("banner");
  b.className = cls;
  const earlier = (s.earlier_reports || []).length ? `Earlier report ${s.earlier_reports.join(", ")} sent ✓` : "";
  b.innerHTML = esc(text) + ((sub || earlier) ? `<small>${esc([sub, earlier].filter(Boolean).join(" · "))}</small>` : "");

  const f = Object.fromEntries(s.fields.map(x => [x.name, x]));
  const html = CARDS.filter(n => f[n] && !(OPTIONAL.has(n) && f[n].display === null)).map(n => {
    const x = f[n];
    let shown = x.display;
    if (n === "quantity" && shown !== null && f.unit && f.unit.display) shown = `${shown} ${f.unit.display}`;
    const key = JSON.stringify(shown);
    const changed = shown !== null && prev[n] !== undefined && prev[n] !== key;
    const first = shown !== null && prev[n] === undefined && Object.keys(prev).length > 0;
    prev[n] = key;
    let val = shown === null ? `<div class="value empty">waiting…</div>` : `<div class="value">${esc(shown)}</div>`;
    if (n === "urgency" && shown !== null) val = `<div class="value"><span class="pill u-${esc(x.value)}">${esc(shown)}</span></div>`;
    const old = (x.history || []).map(h => `<div class="old">${esc(h.value)}</div>`).join("");
    const cls = ["card", shown !== null ? "filled" : "", (changed || first) ? "flash" : "", n === "description" ? "wide" : ""];
    return `<div class="${cls.join(" ")}"><div class="label">${esc(x.label)}</div>${val}${old}</div>`;
  }).join("");
  document.getElementById("cards").innerHTML = html;
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll(".card.flash").forEach(c => c.classList.remove("flash"))));

  if (s.question && s.question.text) document.getElementById("bot").textContent = s.question.text;
  const c = document.getElementById("captions");
  if (s.segments.length) c.innerHTML = s.segments.map(t => `<div>${esc(t)}</div>`).join("");

  document.getElementById("fields").innerHTML = s.fields.filter(x => x.value !== null).map(x =>
    `<tr><td>${esc(x.label)}</td><td>${esc(x.display ?? (typeof x.value === "object" ? JSON.stringify(x.value) : x.value))}</td>`
    + `<td>${x.confidence.toFixed(2)}</td><td>${x.evidence ? "“" + esc(x.evidence) + "”" : ""}</td></tr>`).join("");
}

const es = new EventSource(`/report/${sid}/events`);
es.onmessage = e => render(JSON.parse(e.data));
es.onerror = () => { const b = document.getElementById("banner"); b.className = "warn"; b.textContent = "Disconnected (retrying…)"; };
</script>
</body>
</html>
